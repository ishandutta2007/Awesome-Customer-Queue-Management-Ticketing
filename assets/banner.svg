<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.18); opacity: 0.45; }
    }
    @keyframes moveLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }
    @keyframes floatPill3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pingDot {
      0% { r: 3; opacity: 1; }
      100% { r: 10; opacity: 0; }
    }
    @keyframes shimmer {
      0% { stop-color: #38bdf8; }
      50% { stop-color: #a855f7; }
      100% { stop-color: #38bdf8; }
    }
    .orb-glow {
      transform-origin: center;
      animation: pulseOrb 6s ease-in-out infinite;
    }
    .pulse-path {
      stroke-dasharray: 10, 10;
      animation: moveLine 10s linear infinite;
    }
    .pill-1 { animation: floatPill1 4s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 5s ease-in-out infinite 0.6s; }
    .pill-3 { animation: floatPill3 4.5s ease-in-out infinite 1.2s; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Ambient Orbs (Background layer) -->
  <g class="orb-glow">
    <circle cx="200" cy="100" r="150" fill="#0284c7" opacity="0.2" filter="url(#glow)" />
    <circle cx="1020" cy="300" r="180" fill="#7c3aed" opacity="0.18" filter="url(#glow)" />
    <circle cx="600" cy="390" r="140" fill="#06b6d4" opacity="0.15" filter="url(#glow)" />
  </g>

  <!-- Animated Dynamic Flow Lines representing Queues / Ticket Streams -->
  <g opacity="0.45">
    <path class="pulse-path" d="M -50 90 Q 300 20 600 90 T 1250 80" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="pulse-path" d="M -50 340 Q 350 400 700 330 T 1250 350" fill="none" stroke="#818cf8" stroke-width="1.8" />
    <path class="pulse-path" d="M 100 420 Q 500 220 900 420" fill="none" stroke="#c084fc" stroke-width="1.5" />
  </g>

  <!-- Subtle Ambient Queue Simulation Nodes in the Upper / Lower background -->
  <g opacity="0.35">
    <circle cx="880" cy="80" r="4" fill="#38bdf8" />
    <circle cx="940" cy="80" r="4" fill="#818cf8" />
    <circle cx="1000" cy="80" r="5" fill="#34d399" filter="url(#softGlow)" />
    <line x1="884" y1="80" x2="936" y2="80" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="944" y1="80" x2="995" y2="80" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" />
  </g>

  <!-- Foreground Content: Header, Badges, Title, Subtitle -->
  <g id="foreground">
    <!-- Category Tag / Top Pill -->
    <g transform="translate(600, 75)">
      <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="-135" cy="0" r="4" fill="#34d399" filter="url(#softGlow)" />
      <text x="10" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" text-anchor="middle">AWESOME ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="155" fill="url(#primaryGlow)" filter="url(#softGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
      Customer Queue Management &amp; Ticketing
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0.2">
      Curated List of SaaS Platforms &amp; Open-Source Virtual Queuing, Smart Ticketing &amp; Real-Time Service Flow Control
    </text>

    <!-- Floating Dynamic Badges / Feature Pills (Positioned below to never obscure text) -->
    <g class="pill-1" transform="translate(260, 265)">
      <rect x="0" y="0" width="190" height="46" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <text x="25" y="28" font-size="16">⚡</text>
      <text x="50" y="22" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">Virtual Queues</text>
      <text x="50" y="37" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">SMS &amp; Live Tracking</text>
    </g>

    <g class="pill-2" transform="translate(505, 265)">
      <rect x="0" y="0" width="190" height="46" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" opacity="0.95" />
      <text x="25" y="28" font-size="16">🎟️</text>
      <text x="50" y="22" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">Smart Ticketing</text>
      <text x="50" y="37" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Kiosks &amp; QR Self Check-in</text>
    </g>

    <g class="pill-3" transform="translate(750, 265)">
      <rect x="0" y="0" width="190" height="46" rx="12" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" opacity="0.95" />
      <text x="25" y="28" font-size="16">🌐</text>
      <text x="50" y="22" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">Open-Source Core</text>
      <text x="50" y="37" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Self-Hosted &amp; Concurrency Safe</text>
    </g>

    <!-- Bottom Metrics Banner / Status Line -->
    <g transform="translate(600, 360)">
      <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle" letter-spacing="0.5">
        🏥 Clinics &amp; Hospitals  •  🏦 Banks &amp; Branches  •  🏛️ Public Sector Offices  •  🛍️ Retail Concierge
      </text>
    </g>
  </g>
</svg>
